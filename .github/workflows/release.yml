name: Create client release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0
        required: true
        default: v1.0
      title:
        description: Release title
        required: true
        default: Likenostalgia Client v1.0

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag }}" --title "${{ inputs.title }}" --draft --generate-notes
